name: Trazia
options:
  bundleIdPrefix: com.valgraffimbit
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  Trazia:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valgraffimbit.trazia
        PRODUCT_NAME: Trazia
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    info:
      properties:
        CFBundleDisplayName: Trazia
        NSLocationWhenInUseUsageDescription: "Trazia usa tu ubicación para mostrarte en el mapa y calcular rutas desde donde estás."
        NSMicrophoneUsageDescription: "Trazia puede usar el micrófono para que dictes una dirección."
        UILaunchScreen: {}
        UIUserInterfaceStyle: Automatic
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
