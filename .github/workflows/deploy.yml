name: Deploy Trazia to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *' # Daily 02:17 Colombia; GitHub may delay scheduled runs.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Restore last valid address snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/addresses/cali
          key: cali-address-db-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cali-address-db-v1-
      - name: Record current address snapshot
        id: snapshot-before
        shell: bash
        run: |
          if [ -f data/addresses/cali/manifest.json ]; then
            version="$(python3 -c 'import json; print(json.load(open("data/addresses/cali/manifest.json"))["version"])')"
          else
            version=none
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build or refresh own Cali address database
        run: python3 scripts/update-cali-addresses.py
      - name: Record validated address snapshot
        id: snapshot-after
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open("data/addresses/cali/manifest.json"))["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Preserve validated address snapshot
        if: steps.snapshot-before.outputs.version != steps.snapshot-after.outputs.version
        uses: actions/cache/save@v4
        with:
          path: data/addresses/cali
          key: cali-address-db-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Refresh official IGAC cadastre catalog
        run: python3 scripts/update-cadastre-catalog.py
      - name: Refresh public ANSV camera locations
        run: python3 scripts/update-speed-cameras.py
      - name: Configure TomTom browser key
        env:
          TOMTOM_BROWSER_KEY: ${{ vars.TOMTOM_BROWSER_KEY }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          key = os.environ.get('TOMTOM_BROWSER_KEY', '').strip()
          config = json.dumps({'tomtomApiKey': key}, ensure_ascii=True)
          Path('config.js').write_text('window.TRAZIA_CONFIG = Object.freeze(' + config + ');\n')
          if not key:
              print('::warning::TomTom is not configured; existing address providers remain active.')
          PYTHON
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
