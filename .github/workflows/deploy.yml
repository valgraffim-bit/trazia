name: Deploy Trazia to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Refresh public ANSV camera locations
        run: python3 scripts/update-speed-cameras.py
      - name: Configure TomTom browser key
        env:
          TOMTOM_BROWSER_KEY: ${{ vars.TOMTOM_BROWSER_KEY }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          key = os.environ.get('TOMTOM_BROWSER_KEY', '').strip()
          config = json.dumps({'tomtomApiKey': key}, ensure_ascii=True)
          Path('config.js').write_text('window.TRAZIA_CONFIG = Object.freeze(' + config + ');\n')
          if not key:
              print('::warning::TomTom is not configured; existing address providers remain active.')
          PYTHON
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
